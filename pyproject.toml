[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underscope"
version = "0.1.0"
description = "Vehicle intelligence platform: disposition decision engine for damaged vehicles"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "pandas", "pyyaml", "typer"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Real damage detector (Claude vision). The engine and tests run without it.
vision = ["anthropic"]

[project.scripts]
underscope = "underscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
